# Weekly pull requests for outdated npm packages and GitHub Actions. Minor and patch updates of the development
# dependencies come as one pull request; major updates and runtime dependencies come one by one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
